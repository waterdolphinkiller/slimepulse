<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlimePulse Settings &amp; Multi-Agent Hub</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="settings-body">
    <div class="panel">
      <h2>2026 Multi-Agent Hub (Claude Code · Codex · OpenCode · Gemini · Cursor)</h2>
      <div class="row">
        <span>Local Webhook: <code>http://127.0.0.1:47890</code></span>
        <span id="hook-status" class="badge">Checking...</span>
      </div>
      <div id="agent-list" style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0"></div>
      <div class="row">
        <button id="btn-install-hooks" class="btn">One-Click Setup Claude Code</button>
        <button id="btn-install-cursor" class="btn secondary">1-Click Setup Cursor MCP</button>
        <button id="btn-install-gemini" class="btn secondary">1-Click Setup Gemini CLI</button>
        <button id="btn-copy-mcp" class="btn secondary">Copy MCP JSON</button>
        <button id="btn-uninstall-hooks" class="btn secondary">Remove Hooks</button>
      </div>
    </div>

    <div class="panel">
      <h2>Usability, Language &amp; Comfort</h2>
      <div class="row">
        <label for="locale-select">Language / 语言 / 言語</label>
        <select id="locale-select">
          <option value="auto">Auto (System)</option>
          <option value="zh">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
      <div class="row">
        <label for="scale-select">Slime Size (S / M / L)</label>
        <select id="scale-select">
          <option value="0.75">Small (75% — Laptop Friendly)</option>
          <option value="1">Medium (100% — Default)</option>
          <option value="1.25">Large (125% — 4K Monitor)</option>
        </select>
      </div>
      <div class="row">
        <label><input id="lock-position" type="checkbox" /> Lock Position (Prevent Accidental Drag)</label>
        <label><input id="eco-mode" type="checkbox" /> Eco Battery-Saver Mode (24 FPS)</label>
      </div>
    </div>

    <div class="panel">
      <h2>Slime DNA (Pure-Code Customization)</h2>
      <div class="row">
        <label for="flavor-select">Jelly Flavor</label>
        <select id="flavor-select">
          <option value="classic-green">Optical Emerald Jelly (经典绿色史莱姆)</option>
          <option value="cyber-aqua">Glacier Aqua Jelly (冰川透明果冻)</option>
          <option value="berry-pink">Sakura Peach Jelly (草莓蜜桃果冻)</option>
        </select>
      </div>
      <div class="row">
        <label for="accessory-select">Pure-Code Accessory</label>
        <select id="accessory-select">
          <option value="sprout">🌱 Sprout Leaf (小草芽)</option>
          <option value="crown">👑 Golden Crown (小皇冠)</option>
          <option value="headphones">🎧 Headphones (耳机)</option>
          <option value="shades">🕶️ Cool Shades (墨镜)</option>
          <option value="wizard">🧙 Wizard Hat (巫师帽)</option>
          <option value="none">None (纯净果冻)</option>
        </select>
      </div>
      <div class="row">
        <label for="translucency-range">Jelly Opacity</label>
        <input id="translucency-range" type="range" min="0.45" max="0.90" step="0.02" value="0.72" />
      </div>
      <div class="row">
        <label for="bubble-range">Internal Bubbles</label>
        <input id="bubble-range" type="range" min="3" max="14" step="1" value="9" />
      </div>
      <textarea id="dna-json" rows="6" style="width:100%;background:#0b131e;color:#86efac;border:1px solid #253a52;border-radius:8px;padding:8px;font:12px monospace"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="btn-copy-dna" class="btn secondary">Copy Slime DNA JSON</button>
        <button id="btn-import-dna" class="btn secondary">Apply Pasted JSON</button>
      </div>
    </div>

    <div class="panel">
      <h2>Hardware, Budget, Wellness &amp; Clipboard AI</h2>
      <div class="row">
        <label for="load-threshold">High CPU/GPU Threshold (%)</label>
        <input id="load-threshold" type="number" min="20" max="99" value="75" />
      </div>
      <div class="row">
        <label for="budget-alert-usd">Token Burp Alert Threshold (USD)</label>
        <input id="budget-alert-usd" type="number" min="0.1" max="100" step="0.5" value="2.0" />
      </div>
      <div class="row">
        <label for="pomo-minutes">Anti-Burnout Reminder (min)</label>
        <input id="pomo-minutes" type="number" min="5" max="180" value="45" />
      </div>
      <div class="row">
        <label><input id="meeting-stealth-enabled" type="checkbox" /> Auto Meeting Stealth Melt (Zoom/OBS/Teams)</label>
        <label><input id="night-glow-enabled" type="checkbox" /> Auto Late-Night Jellyfish Glow (23:00+)</label>
      </div>
      <div class="row">
        <label><input id="sound-enabled" type="checkbox" /> Squishy "Boing!" Chime</label>
        <label><input id="ripple-enabled" type="checkbox" /> Jelly Keystroke Droplets</label>
      </div>
      <div class="row">
        <label for="ai-provider">AI Provider</label>
        <select id="ai-provider">
          <option value="ollama">Local Ollama (Free, Offline)</option>
          <option value="openai">OpenAI-Compatible API</option>
          <option value="anthropic">Anthropic Claude API</option>
        </select>
      </div>
      <div class="row">
        <label for="ai-endpoint">Endpoint URL</label>
        <input id="ai-endpoint" type="text" />
      </div>
      <div class="row">
        <label for="ai-model">Model</label>
        <input id="ai-model" type="text" />
      </div>
      <div class="row">
        <label for="ai-key">API Key (blank for Ollama)</label>
        <input id="ai-key" type="password" placeholder="sk-..." />
      </div>
    </div>

    <div class="row">
      <button id="btn-save" class="btn">Save Settings</button>
      <span id="save-toast" style="color: #4ade80; font-size: 13px"></span>
    </div>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>

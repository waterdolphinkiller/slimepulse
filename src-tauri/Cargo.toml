[package]
name = "slimepulse"
version = "6.1.0"
description = "Pure-code 60 FPS optical translucent jelly slime companion (<10MB) for Claude Code, Cursor & AI agents with multi-session mitosis, click-to-focus terminal, and CPU/GPU load monitoring."
authors = ["SlimePulse Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "slimepulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
sysinfo = "0.33"
rdev = "0.5"
dirs = "5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
